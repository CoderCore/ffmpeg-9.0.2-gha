name: build-ffmpeg-9.0.2-static

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm yasm pkg-config curl gpg file \
            zlib1g-dev libx264-dev libmp3lame-dev \
            libvorbis-dev libopus-dev libnuma-dev

      - name: Download FFmpeg 9.0.2 source and signature
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -O https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          curl -fsSL --retry 3 --retry-delay 2 -O https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz.asc

      - name: Verify GPG signature
        id: gpg
        continue-on-error: true
        run: |
          ( set -x
            export GNUPGHOME="$(mktemp -d)"
            # 官方发布的发布签名公钥（指纹 FCF986EA15E6E293A5644F10B4322F04D67658D8）
            curl -fsSL --retry 3 --retry-delay 2 https://ffmpeg.org/ffmpeg-devel.asc -o ffmpeg-devel.asc
            gpg --import ffmpeg-devel.asc
            gpg --list-keys
            gpg --verify ffmpeg-9.0.2.tar.xz.asc ffmpeg-9.0.2.tar.xz
          ) 2>&1 | tee gpg-verify.log
          exit "${PIPESTATUS[0]}"

      - name: Fail on GPG verify error (commit log)
        if: steps.gpg.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpg-verify.log
          if git diff --cached --quiet; then
            echo "log unchanged; skipping push"
          else
            git commit -m "gpg verify failure log"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
              || { echo "PUSH FAILED; dumping gpg-verify.log inline:"; cat gpg-verify.log; }
          fi
          exit 1

      - name: Extract
        run: tar -xf ffmpeg-9.0.2.tar.xz

      - name: Build x265 4.1 static (distro 3.5 too old for FFmpeg 9.0)
        id: x265
        continue-on-error: true
        run: |
          ( set -x
            curl -fsSL http://archive.ubuntu.com/ubuntu/pool/universe/x/x265/x265_4.1.orig.tar.xz -o x265.tar.xz
            tar -xf x265.tar.xz
            SRC="$(tar -tf x265.tar.xz | head -1 | cut -d/ -f1)"
            echo "source dir: $SRC"
            cd "$SRC/source"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED=OFF -DBUILD_STATIC=ON \
              -DENABLE_CLI=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/x265prefix"
            cmake --build build -j"$(nproc)"
            cmake --install build
            # Ubuntu 只有共享版 libgcc_s；x265.pc 的 Libs.private 引用 -lgcc_s，
            # 全静态链接时用一个静态替身满足 ld（与 libgcc.a 同源）
            cp "$(gcc -print-file-name=libgcc.a)" "$GITHUB_WORKSPACE/x265prefix/lib/libgcc_s.a"
            PKG_CONFIG_PATH="$GITHUB_WORKSPACE/x265prefix/lib/pkgconfig" pkg-config --modversion x265
          ) 2>&1 | tee x265-build.log
          exit "${PIPESTATUS[0]}"

      - name: Fail on x265 build error (commit log)
        if: steps.x265.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x265-build.log
          if git diff --cached --quiet; then
            echo "log unchanged; skipping push"
          else
            git commit -m "x265 build failure log"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
              || { echo "PUSH FAILED; dumping x265-build.log inline:"; cat x265-build.log; }
          fi
          exit 1

      - name: Configure (static, GPL, common codecs)
        id: cfg
        continue-on-error: true
        run: |
          ( set -x
            cd ffmpeg-9.0.2
            export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/x265prefix/lib/pkgconfig"
            ./configure --prefix="$GITHUB_WORKSPACE/out" \
              --enable-static --disable-shared --disable-debug \
              --pkg-config-flags=--static --extra-cflags=-static \
              --extra-ldflags=-static \
              --enable-gpl --enable-libx264 --enable-libx265 \
              --enable-libmp3lame --enable-libvorbis --enable-libopus
          ) 2>&1 | tee configure.log
          exit "${PIPESTATUS[0]}"

      - name: Fail on configure error (commit log)
        if: steps.cfg.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ffmpeg-9.0.2/ffbuild/config.log config-failure.log 2>/dev/null || true
          git add configure.log config-failure.log
          if git diff --cached --quiet; then
            echo "logs unchanged; skipping push"
          else
            git commit -m "configure failure log"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
              || { echo "PUSH FAILED; dumping logs inline:"; cat configure.log; cat config-failure.log 2>/dev/null; }
          fi
          exit 1

      - name: Build
        run: |
          cd ffmpeg-9.0.2
          make -j"$(nproc)"

      - name: Install
        run: |
          cd ffmpeg-9.0.2
          make install

      - name: Verify version and static linking
        id: verify
        continue-on-error: true
        run: |
          ( set -x
            ./out/bin/ffmpeg -version | head -8
            file ./out/bin/ffmpeg
            readelf -d ./out/bin/ffmpeg | head -10
          ) 2>&1 | tee verify.log
          # 硬断言 1：版本号必须为 9.0.2（release 源码树，无 -git 后缀）
          ./out/bin/ffmpeg -version | head -1 | grep -Eq '^ffmpeg version n?9\.0\.2 +Copyright' \
            && echo "VERSION ASSERT: OK" \
            || { echo "VERSION ASSERT: FAIL"; exit 1; }
          # 硬断言 2：ELF 无 NEEDED 条目 = 真静态链接
          if readelf -d ./out/bin/ffmpeg | grep -q 'NEEDED'; then
            echo "STATIC ASSERT: FAIL (dynamic NEEDED entries present)"
            exit 1
          else
            echo "STATIC ASSERT: OK (no NEEDED entries)"
          fi

      - name: Fail on verify error (commit log)
        if: steps.verify.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify.log
          if git diff --cached --quiet; then
            echo "log unchanged; skipping push"
          else
            git commit -m "verify failure log"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
              || { echo "PUSH FAILED; dumping verify.log inline:"; cat verify.log; }
          fi
          exit 1

      - name: Package artifact
        run: |
          tar -cJf ffmpeg-9.0.2-linux64-static.tar.xz -C out .
          sha256sum ffmpeg-9.0.2-linux64-static.tar.xz > ffmpeg-9.0.2-linux64-static.tar.xz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-9.0.2-linux64-static
          path: |
            ffmpeg-9.0.2-linux64-static.tar.xz
            ffmpeg-9.0.2-linux64-static.tar.xz.sha256
